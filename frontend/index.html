<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5c1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QR Menu" />

    <title>QR Menu — Rəqəmsal menyu</title>
    <meta name="description" content="Menyuya baxın, QR ilə skan edib sifariş verin." />
    <link rel="canonical" href="/menyu" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="QR Menu — Rəqəmsal menyu" />
    <meta property="og:description" content="🍽 Menyuya baxın və sifariş verin" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QR Menu — Rəqəmsal menyu" />
    <meta name="twitter:description" content="🍽 Menyuya baxın və sifariş verin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Açılış ekranı (intro): JavaScript yüklənməmişdən əvvəl görünür, sayt hazır olanda solaraq silinir (bax: src/lib/splash.js) */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: var(--splash-bg, #f7f0e6); color: var(--splash-fg, #5c1a2e); transition: opacity .45s ease, visibility .45s; }
      #splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .splash-logo { width: 92px; height: 92px; border-radius: 50%; background: var(--splash-fg, #5c1a2e); color: #fff; display: flex; align-items: center; justify-content: center; font: 600 40px Georgia, 'Times New Roman', serif; overflow: hidden; box-shadow: 0 18px 40px -18px rgba(32,26,22,.55); animation: splash-pop .7s cubic-bezier(.2,.9,.3,1.2) both; }
      #splash .splash-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #splash .splash-name { font: 600 28px Georgia, 'Times New Roman', serif; letter-spacing: .01em; text-align: center; padding: 0 24px; animation: splash-rise .7s .1s ease both; }
      #splash .splash-bar { width: 132px; height: 3px; border-radius: 3px; background: rgba(32,26,22,.1); overflow: hidden; }
      #splash .splash-bar::after { content: ''; display: block; width: 45%; height: 100%; border-radius: 3px; background: var(--splash-fg, #5c1a2e); animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes splash-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) { #splash .splash-logo, #splash .splash-name { animation: none; } #splash .splash-bar::after { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Yüklənir">
      <div class="splash-logo" id="splash-logo">Q</div>
      <div class="splash-name" id="splash-name">QR Menu</div>
      <div class="splash-bar"></div>
    </div>
    <script>
      // Son ziyarətdən yadda qalan restoran adı/loqosu/rəngləri ilə (yoxdursa standart) — brend dərhal görünsün
      (function () {
        try {
          var b = JSON.parse(localStorage.getItem('qrmenu_brand') || 'null');
          var root = document.getElementById('splash');
          if (!b || !root) return;
          if (b.background) root.style.setProperty('--splash-bg', b.background);
          if (b.primary) root.style.setProperty('--splash-fg', b.primary);
          if (b.name) {
            document.getElementById('splash-name').textContent = b.name;
            document.getElementById('splash-logo').textContent = b.name.trim().charAt(0).toUpperCase();
          }
          if (b.logo) {
            var img = new Image();
            img.alt = '';
            img.onload = function () { var l = document.getElementById('splash-logo'); if (l) { l.textContent = ''; l.appendChild(img); } };
            img.src = b.logo;
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
